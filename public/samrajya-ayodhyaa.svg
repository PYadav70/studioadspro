<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0b1320; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="ayodhyaDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="goldAyodhyaBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="ayodhyaCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ayodhyaDarkBg)" />

  <!-- APP CONTAINER -->
  <g transform="translate(40, 24)" filter="url(#ayodhyaCardShadow)">
    <rect width="1120" height="627" rx="20" fill="#0f172a" />

    <!-- TOP NAVBAR -->
    <g transform="translate(40, 24)">
      <!-- Sun Logo -->
      <g>
        <circle cx="18" cy="18" r="14" fill="#f59e0b" />
        <path d="M 18,2 L 18,34 M 2,18 L 34,18 M 6,6 L 30,30 M 6,30 L 30,6" stroke="#fbbf24" stroke-width="2" />
        <circle cx="18" cy="18" r="8" fill="#d97706" />
        <text x="44" y="20" font-family="'Times New Roman', serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">SAMRAJYA</text>
        <text x="44" y="32" font-family="'Times New Roman', serif" font-weight="700" font-size="10" fill="#f59e0b" letter-spacing="3">AYODHYA</text>
      </g>

      <!-- Nav Links -->
      <g transform="translate(380, 12)">
        <text x="0" y="12" font-weight="600" font-size="12" fill="#ffffff">Home</text>
        <text x="60" y="12" font-weight="600" font-size="12" fill="#cbd5e1">About</text>
        <text x="120" y="12" font-weight="600" font-size="12" fill="#cbd5e1">Gallery</text>
        <text x="180" y="12" font-weight="600" font-size="12" fill="#cbd5e1">Amenities</text>
        <text x="260" y="12" font-weight="600" font-size="12" fill="#cbd5e1">Blog</text>
        <text x="310" y="12" font-weight="600" font-size="12" fill="#cbd5e1">Investment</text>
        <text x="400" y="12" font-weight="600" font-size="12" fill="#cbd5e1">Contact</text>
      </g>

      <!-- Call & CTA -->
      <g transform="translate(860, 0)">
        <text x="0" y="22" font-weight="600" font-size="12" fill="#ffffff">📞 Call</text>
        <rect x="50" y="2" width="120" height="36" rx="8" fill="url(#goldAyodhyaBtn)" />
        <text x="110" y="24" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">Get In Touch</text>
      </g>
    </g>

    <!-- HERO BACKGROUND TOWNSHIP ARCHITECTURE GRAPHIC -->
    <g transform="translate(0, 80)">
      <!-- Evening Sky Gradient -->
      <linearGradient id="townshipSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>
      <rect width="1120" height="547" rx="0" fill="url(#townshipSky)" />

      <!-- Palace Silhouette Background -->
      <g opacity="0.25" fill="#334155">
        <polygon points="100,250 180,120 260,250" />
        <rect x="120" y="250" width="120" height="200" />
        <polygon points="300,250 420,80 540,250" />
        <rect x="330" y="250" width="180" height="200" />
        <polygon points="600,250 680,120 760,250" />
        <rect x="620" y="250" width="120" height="200" />
      </g>

      <!-- LEFT HERO CONTENT -->
      <g transform="translate(40, 40)">
        <!-- Badge -->
        <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="18" font-size="10" fill="#f59e0b">📍 VIP Road, Ayodhya, Uttar Pradesh</text>

        <!-- Headline -->
        <g transform="translate(0, 70)">
          <text x="0" y="0" font-family="'Times New Roman', serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">A considered address</text>
          <text x="0" y="52" font-family="'Times New Roman', serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">for living and</text>
          <text x="0" y="104" font-family="'Times New Roman', serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">investment in Ayodhya</text>
        </g>

        <!-- Subtitle -->
        <text x="0" y="210" font-size="13" fill="#cbd5e1" width="480">
          <tspan x="0" dy="0">Explore studio apartments, serviced residences and commercial</tspan>
          <tspan x="0" dy="20">spaces at Samrajya Ayodhyaa—planned around connectivity,</tspan>
          <tspan x="0" dy="20">comfort and long-term value.</tspan>
        </text>

        <!-- Bullet Checkmarks -->
        <g transform="translate(0, 290)">
          <text x="0" y="0" font-weight="700" font-size="11" fill="#f59e0b">✓ Residential &amp; commercial options</text>
          <text x="210" y="0" font-weight="700" font-size="11" fill="#f59e0b">✓ Site-visit assistance</text>
          <text x="360" y="0" font-weight="700" font-size="11" fill="#f59e0b">✓ Transparent guidance</text>
        </g>

        <!-- Action Buttons -->
        <g transform="translate(0, 325)">
          <rect width="180" height="46" rx="10" fill="url(#goldAyodhyaBtn)" />
          <text x="32" y="28" font-weight="800" font-size="12" fill="#0f172a">Explore the project →</text>

          <g transform="translate(195, 0)">
            <rect width="180" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
            <text x="30" y="28" font-weight="700" font-size="12" fill="#ffffff">📞 Speak to an advisor</text>
          </g>
        </g>
      </g>

      <!-- RIGHT FLOATING SITE VISIT LEAD FORM CARD -->
      <g transform="translate(680, 20)">
        <rect width="400" height="480" rx="20" fill="#ffffff" />

        <g transform="translate(30, 30)">
          <text x="0" y="16" font-weight="800" font-size="10" fill="#d97706" letter-spacing="1.5">REQUEST PROJECT DETAILS</text>
          <text x="0" y="44" font-family="'Times New Roman', serif" font-weight="900" font-size="28" fill="#0f172a">Plan your site visit</text>
          <text x="0" y="66" font-size="11" fill="#64748b">Share your requirement to receive availability, pricing and visit assistance.</text>

          <!-- Input 1: Full name -->
          <g transform="translate(0, 100)">
            <text x="0" y="0" font-weight="600" font-size="11" fill="#334155">Full name</text>
            <rect y="8" width="340" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
            <text x="14" y="32" font-size="12" fill="#94a3b8">Your name</text>
          </g>

          <!-- Input 2: Mobile number -->
          <g transform="translate(0, 170)">
            <text x="0" y="0" font-weight="600" font-size="11" fill="#334155">Mobile number</text>
            <rect y="8" width="340" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
            <text x="14" y="32" font-size="12" fill="#334155">+91 98765 43210</text>
          </g>

          <!-- Input 3: Interest dropdown -->
          <g transform="translate(0, 240)">
            <text x="0" y="0" font-weight="600" font-size="11" fill="#334155">I am interested in</text>
            <rect y="8" width="340" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
            <text x="14" y="32" font-size="12" fill="#64748b">Select an option</text>
            <path d="M 315,26 L 320,32 L 325,26" stroke="#64748b" stroke-width="2" fill="none" />
          </g>

          <!-- Submit Button -->
          <g transform="translate(0, 315)">
            <rect width="340" height="48" rx="10" fill="#0f172a" />
            <text x="170" y="29" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">Request a callback</text>
          </g>

          <!-- Footer Privacy -->
          <text x="170" y="390" font-size="10" fill="#64748b" text-anchor="middle">🛡 Your details are used only to respond to this enquiry.</text>
        </g>
      </g>
    </g>

  </g>
</svg>
