<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#5c5a4b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bioHerbalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d3c2e" />
      <stop offset="50%" stop-color="#4a4838" />
      <stop offset="100%" stop-color="#2a291f" />
    </linearGradient>

    <linearGradient id="greenStatBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="30%" stop-color="#15803d" />
      <stop offset="70%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>

    <filter id="bioCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="bottleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bioHerbalBg)" />

  <!-- APP CONTAINER -->
  <g transform="translate(40, 24)" filter="url(#bioCardShadow)">
    <rect width="1120" height="627" rx="20" fill="#4a4838" />

    <!-- TOP NAVBAR -->
    <g transform="translate(0, 0)">
      <rect width="1120" height="60" rx="20" fill="#d4d4d8" opacity="0.95" />
      
      <!-- Logo -->
      <g transform="translate(30, 12)">
        <rect width="110" height="36" rx="6" fill="#15803d" />
        <path d="M 16,18 Q 24,10 24,26" stroke="#fef08a" stroke-width="2" fill="none" />
        <text x="32" y="23" font-weight="900" font-size="14" fill="#ffffff">ArogyaBio</text>
      </g>

      <!-- Search Bar -->
      <g transform="translate(380, 14)">
        <rect width="280" height="32" rx="6" fill="#ca8a04" opacity="0.4" />
        <text x="16" y="21" font-size="11" fill="#451a03">Search products...</text>
        <!-- Search icon -->
        <circle cx="260" cy="16" r="6" stroke="#451a03" stroke-width="1.5" fill="none" />
        <line x1="264" y1="20" x2="270" y2="26" stroke="#451a03" stroke-width="1.5" />
      </g>

      <!-- Links -->
      <g transform="translate(720, 22)">
        <text x="0" y="12" font-size="11" fill="#1c1917">Home</text>
        <text x="50" y="12" font-size="11" fill="#1c1917">Shop</text>
        <text x="95" y="12" font-size="11" fill="#1c1917">Catalogue</text>
        <text x="160" y="12" font-size="11" fill="#1c1917">About</text>
        <text x="210" y="12" font-size="11" fill="#1c1917">Blog</text>
        <text x="250" y="12" font-size="11" fill="#1c1917">Contact</text>
      </g>

      <g transform="translate(1010, 14)">
        <rect width="90" height="32" rx="16" fill="#15803d" />
        <text x="45" y="20" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Gout Combo 20% Off</text>
      </g>
    </g>

    <!-- HERO BACKDROP WITH MANDALA DECORATIONS -->
    <g transform="translate(0, 60)">
      <rect width="1120" height="460" fill="#3f3e30" />

      <!-- Left Mandala Motif -->
      <g transform="translate(160, 200)" opacity="0.25" stroke="#fef08a" stroke-width="2" fill="none">
        <circle cx="0" cy="0" r="120" />
        <circle cx="0" cy="0" r="80" />
        <path d="M -120,0 L 120,0 M 0,-120 L 0,120" />
        <path d="M -85,-85 L 85,85 M -85,85 L 85,-85" />
      </g>

      <!-- Right Mandala Motif -->
      <g transform="translate(940, 200)" opacity="0.3" stroke="#facc15" stroke-width="2" fill="none">
        <circle cx="0" cy="0" r="140" />
        <circle cx="0" cy="0" r="90" />
        <path d="M -140,0 L 140,0 M 0,-140 L 0,140" />
        <path d="M -100,-100 L 100,100 M -100,100 L 100,-100" />
      </g>

      <!-- Main Headline Header -->
      <text x="560" y="70" font-weight="900" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Gout Health Complete Combo</text>

      <!-- CENTER PRODUCT BOTTLES SHOWCASE -->
      <g transform="translate(320, 90)" filter="url(#bottleGlow)">
        <!-- Dropper Oil Amber Bottle -->
        <g transform="translate(0, 0)">
          <!-- Glass Body -->
          <rect x="20" y="80" width="130" height="230" rx="20" fill="#78350f" stroke="#b45309" stroke-width="2" />
          <!-- Label -->
          <rect x="25" y="110" width="120" height="160" rx="8" fill="#fefce8" />
          <text x="85" y="145" font-weight="900" font-size="16" fill="#15803d" text-anchor="middle">GOUT</text>
          <text x="85" y="165" font-weight="900" font-size="16" fill="#15803d" text-anchor="middle">HEALTH</text>
          <text x="85" y="185" font-weight="700" font-size="8" fill="#78350f" text-anchor="middle">Cenritica City Gmine</text>
          <text x="85" y="240" font-weight="800" font-size="8" fill="#15803d" text-anchor="middle">50ml OIL</text>
          
          <!-- Gold Cap & Rubber Dropper -->
          <rect x="60" y="50" width="50" height="30" rx="4" fill="#eab308" />
          <path d="M 75,50 L 75,10 Q 85,0 95,10 L 95,50 Z" fill="#fef08a" />
        </g>

        <!-- Plastic/Glass Capsule Jar -->
        <g transform="translate(170, 40)">
          <rect x="20" y="60" width="150" height="210" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
          <rect x="25" y="90" width="140" height="150" rx="10" fill="#ffffff" />
          <text x="95" y="125" font-weight="900" font-size="20" fill="#15803d" text-anchor="middle">GOUT</text>
          <text x="95" y="150" font-weight="900" font-size="20" fill="#15803d" text-anchor="middle">HEALTH</text>
          <text x="95" y="175" font-weight="700" font-size="10" fill="#78350f" text-anchor="middle">Jajre Canto</text>
          <text x="95" y="215" font-weight="800" font-size="10" fill="#15803d" text-anchor="middle">60 CAPSULES</text>

          <!-- Jar Cap -->
          <rect x="40" y="30" width="110" height="30" rx="6" fill="#78350f" />
        </g>

        <!-- Floating Offer Pill & CTA Button -->
        <g transform="translate(180, 80)">
          <rect width="130" height="22" rx="11" fill="#f87171" />
          <text x="65" y="15" font-weight="800" font-size="8" fill="#ffffff" text-anchor="middle">⚡ 20% OFF LIMITED TIME</text>

          <g transform="translate(0, 32)">
            <rect width="130" height="34" rx="8" fill="#15803d" />
            <text x="65" y="21" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">🛒 Shop Combo Now</text>
          </g>
        </g>

        <!-- Floating Green Info Banner (Top Right) -->
        <g transform="translate(300, 10)">
          <rect width="230" height="50" rx="12" fill="#14532d" opacity="0.9" />
          <text x="14" y="20" font-weight="700" font-size="9" fill="#ffffff">Oil + Capsules at 20% OFF - Only ₹1,999!</text>
          <text x="14" y="34" font-weight="500" font-size="9" fill="#86efac">Get complete relief with our premium combo.</text>
        </g>
      </g>
    </g>

    <!-- BOTTOM STATS BANNER ROW -->
    <g transform="translate(0, 520)">
      <rect width="1120" height="107" rx="0" fill="url(#greenStatBar)" />

      <!-- Stat 1 -->
      <g transform="translate(120, 25)">
        <text x="30" y="20" font-size="20" text-anchor="middle">📦</text>
        <text x="30" y="45" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">44</text>
        <text x="30" y="60" font-weight="700" font-size="9" fill="#fef08a" text-anchor="middle">Pure Products</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(380, 25)">
        <text x="30" y="20" font-size="20" text-anchor="middle">👥</text>
        <text x="30" y="45" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">10K+</text>
        <text x="30" y="60" font-weight="700" font-size="9" fill="#fef08a" text-anchor="middle">Trusted Wellness</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(650, 25)">
        <text x="30" y="20" font-size="20" text-anchor="middle">🎗</text>
        <text x="30" y="45" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">25+</text>
        <text x="30" y="60" font-weight="700" font-size="9" fill="#fef08a" text-anchor="middle">Years Heritage</text>
      </g>

      <!-- Stat 4 -->
      <g transform="translate(910, 25)">
        <text x="30" y="20" font-size="20" text-anchor="middle">📈</text>
        <text x="30" y="45" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">300%</text>
        <text x="30" y="60" font-weight="700" font-size="9" fill="#fef08a" text-anchor="middle">Growth Impact</text>
      </g>
    </g>

  </g>
</svg>
