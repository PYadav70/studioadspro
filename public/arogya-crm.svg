<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#072111; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Georgia, serif;">
  <defs>
    <linearGradient id="arogyaGreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a17" />
      <stop offset="50%" stop-color="#072011" />
      <stop offset="100%" stop-color="#031208" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="arogyaCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143e24" />
      <stop offset="100%" stop-color="#0b2917" />
    </linearGradient>

    <filter id="loginCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#facc15" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Forest Green Canvas -->
  <rect width="1200" height="675" fill="url(#arogyaGreenBg)" />

  <!-- Ambient Radial Glow -->
  <circle cx="200" cy="200" r="400" fill="#15803d" opacity="0.15" />

  <!-- MAIN CONTAINER -->
  <g transform="translate(60, 40)">
    
    <!-- TOP LOGO HEADER -->
    <g transform="translate(0, 10)">
      <!-- Green Rounded Icon -->
      <rect width="56" height="56" rx="18" fill="#164e28" stroke="#226738" stroke-width="1.5" />
      <!-- Star Icon -->
      <path d="M 28,14 L 32,24 L 42,28 L 32,32 L 28,42 L 24,32 L 14,28 L 24,24 Z" fill="url(#goldTextGrad)" filter="url(#starGlow)" />
      
      <!-- Brand Name -->
      <text x="76" y="38" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">AROGYA ELITE</text>
    </g>

    <!-- LEFT HERO TEXT & FEATURE CARDS -->
    <g transform="translate(0, 130)">
      <!-- Headlines -->
      <text x="0" y="50" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-0.5">Precision CRM for</text>
      <text x="0" y="110" font-family="'Times New Roman', Georgia, serif" font-style="italic" font-weight="900" font-size="52" fill="url(#goldTextGrad)" letter-spacing="-0.5">Wellness Leaders.</text>

      <!-- Paragraph -->
      <text x="0" y="170" font-family="-apple-system, sans-serif" font-weight="400" font-size="16" fill="#a7f3d0" width="520">
        <tspan x="0" dy="0">Automated lead prioritization and high-velocity distribution</tspan>
        <tspan x="0" dy="26">for the modern Ayurvedic enterprise.</tspan>
      </text>

      <!-- Bottom Feature Cards -->
      <g transform="translate(0, 250)">
        <!-- Feature 1: Elite Security -->
        <rect width="220" height="110" rx="24" fill="url(#arogyaCardBg)" stroke="#226738" stroke-width="1.5" />
        <!-- Shield Icon -->
        <g transform="translate(24, 20)">
          <path d="M 12,2 L 22,6 L 22,14 Q 22,22 12,26 Q 2,22 2,14 L 2,6 Z" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 8,13 L 11,16 L 16,10" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
        </g>
        <text x="24" y="70" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="15" fill="#ffffff">Elite Security</text>
        <text x="24" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#86efac">Bypass-resistant encryption.</text>

        <!-- Feature 2: Velocity Engine -->
        <g transform="translate(240, 0)">
          <rect width="220" height="110" rx="24" fill="url(#arogyaCardBg)" stroke="#226738" stroke-width="1.5" />
          <!-- Chart Trend Icon -->
          <g transform="translate(24, 20)">
            <path d="M 2,20 L 8,14 L 14,18 L 24,6 M 18,6 L 24,6 L 24,12" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </g>
          <text x="24" y="70" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="15" fill="#ffffff">Velocity Engine</text>
          <text x="24" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#86efac">Top-of-stack distribution.</text>
        </g>
      </g>
    </g>

    <!-- RIGHT FLOATING LOGIN PORTAL CARD -->
    <g transform="translate(580, 20)" filter="url(#loginCardShadow)">
      <rect width="480" height="540" rx="36" fill="#fcfdfd" />

      <!-- Card Inner Content -->
      <g transform="translate(50, 45)">
        <!-- Portal Heading -->
        <text x="190" y="40" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="34" fill="#072011" text-anchor="middle">Elite Portal</text>
        <text x="190" y="64" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#226738" text-anchor="middle" letter-spacing="2.5">AUTHORIZED COMMAND CENTER</text>

        <!-- Form Field 1: Email Terminal -->
        <g transform="translate(0, 110)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#657e6c" letter-spacing="1.5">EMAIL TERMINAL</text>
          <rect y="12" width="380" height="54" rx="16" fill="#f3f6f4" />
          <text x="20" y="45" font-family="'Times New Roman', Georgia, serif" font-weight="800" font-size="16" fill="#072011">name@arogyabio.com</text>
        </g>

        <!-- Form Field 2: Secret Sequence -->
        <g transform="translate(0, 210)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#657e6c" letter-spacing="1.5">SECRET SEQUENCE</text>
          <rect y="12" width="380" height="54" rx="16" fill="#f3f6f4" />
          <text x="20" y="52" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" fill="#072011" letter-spacing="4">••••••••</text>
        </g>

        <!-- Action Button: Initiate Session -->
        <g transform="translate(0, 320)">
          <rect width="380" height="60" rx="30" fill="#072011" />
          <text x="170" y="37" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle">Initiate Session</text>
          <!-- Lightning Icon -->
          <path d="M 245,22 L 235,34 L 243,34 L 238,44 L 250,30 L 241,30 Z" fill="#facc15" />
        </g>

        <!-- Encrypted Operational Endpoint footer -->
        <text x="190" y="435" font-family="'Times New Roman', Georgia, serif" font-style="italic" font-weight="600" font-size="11" fill="#8ca192" text-anchor="middle" letter-spacing="1">ENCRYPTED OPERATIONAL ENDPOINT</text>
      </g>
    </g>

  </g>
</svg>
