<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0c111c; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="nikunjBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="goldAccentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="whatsappBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>

    <filter id="cardShadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <linearGradient id="heroOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#nikunjBgGrad)" />

  <!-- MAIN BROWSER CONTAINER -->
  <g transform="translate(30, 20)" filter="url(#cardShadowSoft)">
    <rect width="1140" height="635" rx="16" fill="#ffffff" />

    <!-- TOP HEADER NAVBAR -->
    <g transform="translate(30, 16)">
      <!-- Brand Logo -->
      <g>
        <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <path d="M 12,25 C 12,15 20,10 20,10 C 20,10 28,15 28,25 C 25,27 15,27 12,25 Z" fill="#f59e0b" />
        <text x="48" y="18" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="1">NIKUNJ HERITAGE</text>
        <text x="48" y="29" font-family="sans-serif" font-weight="800" font-size="8" fill="#d97706" letter-spacing="3">INFRABUILD</text>
      </g>

      <!-- Navigation Links -->
      <g transform="translate(290, 14)">
        <text x="0" y="10" font-weight="800" font-size="11" fill="#0f172a">HOME</text>
        <line x1="0" y1="15" x2="36" y2="15" stroke="#d97706" stroke-width="2" />
        <text x="55" y="10" font-weight="600" font-size="11" fill="#475569">PROPERTIES</text>
        <text x="145" y="10" font-weight="600" font-size="11" fill="#475569">COMPARE</text>
        <text x="215" y="10" font-weight="600" font-size="11" fill="#475569">ROI CALCULATOR</text>
        <text x="325" y="10" font-weight="600" font-size="11" fill="#475569">EVENTS</text>
        <text x="385" y="10" font-weight="600" font-size="11" fill="#475569">BLOGS</text>
        <text x="440" y="10" font-weight="600" font-size="11" fill="#475569">NEWS</text>
        <text x="490" y="10" font-weight="600" font-size="11" fill="#475569">DEVELOPERS</text>
      </g>

      <!-- Right Action Controls -->
      <g transform="translate(870, 2)">
        <!-- Hindi Toggle -->
        <rect x="0" y="0" width="30" height="30" rx="15" fill="#f1f5f9" />
        <text x="15" y="16" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">हिंदी</text>

        <!-- Bookmark -->
        <circle cx="50" cy="15" r="15" fill="#f1f5f9" />
        <path d="M 45,10 L 55,10 L 55,20 L 50,17 L 45,20 Z" fill="none" stroke="#475569" stroke-width="1.5" />

        <!-- Sign In -->
        <rect x="80" y="0" width="60" height="30" rx="15" fill="#f1f5f9" />
        <text x="110" y="18" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Sign In</text>

        <!-- Book Visit Button -->
        <rect x="150" y="-3" width="90" height="36" rx="8" fill="url(#goldAccentBtn)" />
        <text x="195" y="19" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">BOOK VISIT</text>
      </g>
    </g>

    <!-- HERO SECTION WITH ARCHITECTURAL BACKGROUND -->
    <g transform="translate(0, 56)">
      <!-- Background Architecture Illustration -->
      <rect width="1140" height="579" fill="#0f172a" />
      
      <!-- Temple & Heritage Silhouette Backdrop -->
      <g opacity="0.3">
        <polygon points="120,380 200,200 280,380" fill="#475569" />
        <polygon points="220,380 320,150 420,380" fill="#334155" />
        <polygon points="700,380 820,140 940,380" fill="#334155" />
        <polygon points="860,380 940,220 1020,380" fill="#475569" />
        <rect x="0" y="380" width="1140" height="200" fill="#1e293b" />
      </g>

      <!-- Gradient Dark Overlay -->
      <rect width="1140" height="579" fill="url(#heroOverlay)" />

      <!-- HERO CONTENT AREA -->
      <g transform="translate(60, 50)">
        
        <!-- Badges Row -->
        <g>
          <rect width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
          <text x="14" y="17" font-size="9" font-weight="800" fill="#fcd34d" letter-spacing="1">MATHURA HERITAGE STREETS</text>

          <g transform="translate(182, 0)">
            <rect width="210" height="26" rx="13" fill="url(#goldAccentBtn)" />
            <text x="14" y="17" font-size="9" font-weight="900" fill="#0f172a" letter-spacing="1">TEMPLE PROXIMITY. REGISTRY CLARITY.</text>
          </g>
        </g>

        <!-- Main Headline -->
        <g transform="translate(0, 65)">
          <text x="0" y="0" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-0.5">Premium advisory for</text>
          <text x="0" y="52" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-0.5">residential and</text>
          <text x="0" y="104" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-0.5">commercial</text>
          <text x="0" y="156" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-0.5">opportunities in the</text>
          <text x="0" y="208" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="46" fill="#fcd34d" letter-spacing="-0.5">sacred growth belt</text>
        </g>

        <!-- Subtitle -->
        <g transform="translate(0, 310)">
          <text x="0" y="0" font-size="14" fill="#cbd5e1">We help buyers compare liveability, access, and investment context around</text>
          <text x="0" y="22" font-size="14" fill="#cbd5e1">Mathura&apos;s most active property corridors.</text>
        </g>

        <!-- Search Bar Container -->
        <g transform="translate(0, 360)">
          <rect width="680" height="56" rx="12" fill="#ffffff" filter="url(#cardShadowSoft)" />
          <text x="24" y="33" font-size="12" fill="#94a3b8">Search by Location, Temple Corridor, or Plot Size...</text>
          <rect x="550" y="8" width="120" height="40" rx="8" fill="url(#goldAccentBtn)" />
          <text x="610" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">SEARCH NOW</text>
        </g>
      </g>

      <!-- FLOATING ACTION BUTTONS (CALL & WHATSAPP) AT BOTTOM RIGHT -->
      <g transform="translate(860, 470)">
        <!-- Call Now Button -->
        <rect width="110" height="42" rx="21" fill="url(#goldAccentBtn)" />
        <text x="20" y="25" font-size="12">📞</text>
        <text x="42" y="25" font-size="10" font-weight="900" fill="#ffffff">CALL NOW</text>

        <!-- WhatsApp Button -->
        <g transform="translate(120, 0)">
          <rect width="120" height="42" rx="21" fill="url(#whatsappBtnGrad)" />
          <text x="18" y="25" font-size="13">💬</text>
          <text x="40" y="25" font-size="10" font-weight="900" fill="#ffffff">WHATSAPP</text>
        </g>
      </g>

    </g>
  </g>
</svg>